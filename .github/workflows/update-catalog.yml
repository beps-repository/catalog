name: Update catalog data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # ogni notte alle 03:00

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1️⃣ Download CSV
      - name: Scarica CSV Beps
        shell: bash
        run: |
          set -euo pipefail

          echo "➡️ Download CSV Beps..."
          curl -sSL "https://api.allorigins.win/raw?url=https://www.beps.it/media/feed/catalog_private_labels.csv" -o catalog.csv

          echo "📄 File scaricato:"
          ls -lh catalog.csv

          echo "🔎 Prime righe CSV:"
          head -n 5 catalog.csv

          # blocco immediato se AllOrigins restituisce HTML
          if head -n 1 catalog.csv | grep -qi "<!doctype html\|<html"; then
            echo "❌ ERRORE: ricevuto HTML invece del CSV (AllOrigins / blocco / rate limit)"
            exit 1
          fi

      # 2️⃣ CSV → JSON (robusto)
      - name: Converte CSV in JSON
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip >/dev/null
          pip install pandas >/dev/null

          python - <<'PY'
          import pandas as pd
          import sys, os

          CSV_FILE = "catalog.csv"
          OUT_JSON = "catalog/data.json"

          try:
              df = pd.read_csv(
                  CSV_FILE,
                  sep=",",                 # ✔ separatore corretto
                  encoding="utf-8-sig",    # ✔ gestisce BOM
                  dtype=str,               # ✔ tutto come stringa
                  engine="python",         # ✔ più tollerante
                  on_bad_lines="skip"      # ✔ salta righe rotte
              )
          except Exception as e:
              print("❌ Errore lettura CSV:", e)
              sys.exit(1)

          print("✅ CSV letto correttamente")
          print("➡️ Righe lette:", len(df))
          print("➡️ Colonne:", list(df.columns))

          if df.empty:
              print("❌ CSV valido ma senza righe → STOP")
              sys.exit(1)

          # verifica colonne chiave
          required = {"sku", "title", "image_url"}
          cols = {c.lower().strip() for c in df.columns}
          missing = required - cols
          if missing:
              print("❌ Colonne obbligatorie mancanti:", missing)
              sys.exit(1)

          # debug mirato image_additional (NON viene modificato)
          if "image_additional" in df.columns:
              print("🖼️ Esempio image_additional:")
              print(df["image_additional"].dropna().head(3).tolist())

          os.makedirs("catalog", exist_ok=True)

          df.to_json(
              OUT_JSON,
              orient="records",
              force_ascii=False
          )

          print(f"✅ JSON generato correttamente: {OUT_JSON}")
          PY

      # 3️⃣ Commit & push
      - name: Commit e push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add catalog/data.json
          git status

          git commit -m "Aggiornamento catalogo automatico" || echo "ℹ️ Nessuna modifica da salvare"
          git push
