name: Update catalog data

on:
  workflow_dispatch:       # permette avvio manuale dal pannello GitHub
  schedule:
    - cron: "0 3 * * *"    # aggiornamento automatico ogni notte alle 3

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Scarica CSV tramite proxy
        run: |
          mkdir -p catalog
          curl -L "https://api.allorigins.win/raw?url=https://www.beps.it/media/feed/catalog_private_labels.csv" -o catalog/catalog.csv

      - name: Converte CSV in JSON
        run: |
          pip install pandas
          python - <<EOF
          import pandas as pd
          df = pd.read_csv("catalog/catalog.csv")
          df.to_json("catalog/data.json", orient="records", force_ascii=False)
          EOF

      - name: Commit e push aggiornamento
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add catalog/data.json
          git commit -m "Aggiornamento catalogo automatico" || echo "Nessuna modifica da salvare"
          git push
