<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo Beps</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background: #fafafa;
}

h2 {
  margin-top: 40px;
  border-bottom: 2px solid #ddd;
  padding-bottom: 5px;
  text-transform: capitalize;
}

.categoria { margin-bottom: 60px; }

.griglia {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.card {
  display: flex;
  gap: 20px;
  background: #fff;
  border: 1px solid #ddd;
  padding: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

/* ===== AREA IMMAGINE ===== */

.carousel {
  width: 360px;
  height: 360px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}

.carousel-img {
  width: 340px;
  height: 340px;
  object-fit: contain;
  display: block;
}

/* ===== PLACEHOLDER ===== */

.placeholder .carousel-img,
.placeholder .text-line {
  background: linear-gradient(
    90deg,
    #eee 25%,
    #f5f5f5 37%,
    #eee 63%
  );
  background-size: 400% 100%;
  animation: shimmer 1.2s infinite;
}

@keyframes shimmer {
  0% { background-position: 100% 0; }
  100% { background-position: 0 0; }
}

.text-line {
  height: 14px;
  margin-bottom: 8px;
  border-radius: 4px;
}
.text-line.title { height: 18px; width: 70%; }
.text-line.short { width: 90%; }
.text-line.long { width: 95%; }
.text-line.sku { width: 40%; }

/* ===== TESTO ===== */

.card-content { flex: 1; }

.card-content h3 {
  margin: 0 0 8px;
  font-size: 1.2rem;
}

.descrizione {
  display: none; /* attivata dopo primo paint */
}

.sku {
  font-size: 0.85rem;
  color: #666;
}

/* ===== MOBILE ===== */

@media (max-width: 768px) {
  .card {
    flex-direction: column;
    text-align: center;
  }
  .carousel {
    width: 100%;
    height: auto;
  }
  .carousel-img {
    width: 100%;
    max-width: 340px;
    height: auto;
  }
}
</style>
</head>

<body>

<div id="catalogo"></div>

<script>
/* ================= CONFIG ================= */

const PROXY_URL = "https://proxy-catalog-826935378869.europe-west1.run.app";
const PLACEHOLDER_COUNT = 4;

/* ================= UTIL ================= */

function normalizeParam(v) {
  return v ? v.toLowerCase().trim() : null;
}

function formatCategoriaLabel(value) {
  if (!value) return "";
  const s = value.replace(/-/g, " ").toLowerCase();
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ================= URL PARAMS ================= */

const params = new URLSearchParams(location.search);
const categoriaRaw = params.get("categoria");
const categoriaLabel = formatCategoriaLabel(categoriaRaw);
const categoriaNorm = normalizeParam(categoriaLabel);

/* ================= INIT PLACEHOLDER ================= */

const container = document.getElementById("catalogo");

const categoriaBlock = document.createElement("div");
categoriaBlock.className = "categoria";
categoriaBlock.innerHTML = `
  <h2>${categoriaLabel || "Prodotti"}</h2>
  <div class="griglia"></div>
`;
container.appendChild(categoriaBlock);

const grid = categoriaBlock.querySelector(".griglia");

for (let i = 0; i < PLACEHOLDER_COUNT; i++) {
  const card = document.createElement("div");
  card.className = "card placeholder";
  card.innerHTML = `
    <div class="carousel">
      <div class="carousel-img"></div>
    </div>
    <div class="card-content">
      <div class="text-line title"></div>
      <div class="text-line short"></div>
      <div class="text-line long"></div>
      <div class="text-line sku"></div>
    </div>
  `;
  grid.appendChild(card);
}

/* ================= IMMAGINI (COSTRUZIONE OBBLIGATORIA) ================= */

function getProductImages(p) {
  const imgs = [];

  if (p.image_url) imgs.push(p.image_url);

  if (p.image_additional && p.image_path) {
    const base = "https://www.beps.it/items/";
    const path = p.image_path.replace(/^\/+|\/+$/g, "") + "/";

    p.image_additional
      .split(",")
      .map(i => i.trim())
      .filter(Boolean)
      .slice(0, 2)
      .forEach(name => {
        imgs.push(`${base}${path}jpg/${name}_300x300.jpg`);
      });
  }
  return imgs;
}

/* ================= FETCH + RENDER ================= */

fetch(PROXY_URL)
  .then(r => r.json())
  .then(prodotti => {
    const filtrati = prodotti.filter(p => {
      if (categoriaNorm) {
        const cats = p.category?.toLowerCase().split(">").map(c => c.trim()) || [];
        return cats.includes(categoriaNorm);
      }
      return true;
    });

    grid.innerHTML = "";

    filtrati.forEach(p => {
      const imgs = getProductImages(p);

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="carousel">
          <img class="carousel-img"
               data-src="${imgs[0] || ""}"
               alt="${p.title || ""}">
        </div>
        <div class="card-content">
          <h3>${p.title || ""}</h3>
          <div class="descrizione">
            ${p.short_description || ""}
            ${p.description || ""}
          </div>
          <p class="sku"><strong>SKU:</strong> ${p.sku || ""}</p>
        </div>
      `;
      grid.appendChild(card);
    });

    initLazyImages();

    /* mostra descrizioni dopo primo paint */
    requestAnimationFrame(() => {
      document.querySelectorAll(".descrizione").forEach(d => {
        d.style.display = "block";
      });
    });
  });

/* ================= LAZY IMMAGINI ================= */

const imageObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const img = e.target;
    img.src = img.dataset.src;
    img.removeAttribute("data-src");
    imageObserver.unobserve(img);
  });
}, { rootMargin: "100px" });

function initLazyImages() {
  document
    .querySelectorAll("img.carousel-img[data-src]")
    .forEach(img => imageObserver.observe(img));
}
</script>

</body>
</html>
