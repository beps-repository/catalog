<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogo Beps</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #fafafa;
    }
    h2 {
      margin-top: 40px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 5px;
      text-transform: capitalize;
    }
    .categoria {
      margin-bottom: 60px;
    }
    .griglia {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 20px;
      background: #fff;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 0px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      cursor: default; /* non cliccabile */
    }
    .card img {
      flex: 0 0 360px;
      max-width: 360px;
      height: auto;
      border-radius: 0px;
      object-fit: contain;
      margin-right: 30px;
    }
    .card-content {
      flex: 1;
    }
    .card-content h3 {
      margin: 0 0 8px;
      font-size: 1.2rem;
      color: #222;
    }
    .card-content p {
      margin: 0 0 6px;
      font-size: 0.95rem;
      color: #444;
    }
    .card-content .sku {
      font-size: 0.85rem;
      color: #666;
      margin-top: 8px;
    }
    @media (max-width: 768px) {
      .card {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .card img {
        max-width: 100%;
        margin-right: 0;
      }
    }
  </style>
</head>
<body>
  <div id="catalogo"></div>

  <script>
    const fallbackUrl = "catalog/data.json"; // JSON generato dal workflow

    // Normalizza parametri URL (case-insensitive, "-" diventa spazio)
    function normalizeParam(value) {
      if (!value) return null;
      return value
        .toLowerCase()
        .replace(/-/g, " ")
        .trim();
    }

    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        marca: normalizeParam(params.get("marca")),
        categoria: normalizeParam(params.get("categoria"))
      };
    }

    async function caricaCatalogo() {
      try {
        const response = await fetch(fallbackUrl);
        const prodotti = await response.json();
        const { marca, categoria } = getQueryParams();

        const prodottiFiltrati = prodotti.filter(p => {
          const marcaProdotto = p.marca ? p.marca.toLowerCase().trim() : "";
          const categorieProdotto = p.category
            ? p.category.toLowerCase().split(">").map(c => c.trim())
            : [];

          const matchMarca = !marca || marcaProdotto === marca;
          const matchCategoria = !categoria || categorieProdotto.includes(categoria);

          return matchMarca && matchCategoria;
        });

        const categorie = {};
        prodottiFiltrati.forEach(p => {
          const cat = p.category?.split('>').pop().trim() || "Senza categoria";
          if (!categorie[cat]) categorie[cat] = [];
          categorie[cat].push(p);
        });

        const container = document.getElementById("catalogo");
        container.innerHTML = "";

        if (prodottiFiltrati.length === 0) {
          container.innerHTML = "<p>Nessun prodotto trovato.</p>";
          return;
        }

        for (const [categoria, items] of Object.entries(categorie)) {
          const sezione = document.createElement("div");
          sezione.className = "categoria";
          sezione.innerHTML = `<h2>${categoria}</h2>`;

          const griglia = document.createElement("div");
          griglia.className = "griglia";

          items.forEach(p => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              <img src="${p.image_url}" alt="${p.title}">
              <div class="card-content">
                <h3>${p.title}</h3>
                <p>${p.short_description || ""}</p>
                <p>${p.description || ""}</p>
                <p class="sku"><strong>SKU:</strong> ${p.sku}</p>
              </div>
            `;
            // Click disabilitato (niente scheda prodotto)
            griglia.appendChild(card);
          });

          sezione.appendChild(griglia);
          container.appendChild(sezione);
        }
      } catch (error) {
        console.error("Errore durante il caricamento del catalogo:", error);
        document.getElementById("catalogo").innerHTML = "<p>Errore nel caricamento del catalogo.</p>";
      }
    }

    caricaCatalogo();

    // Auto-resize iframe
    function inviaAltezza() {
      const h = document.body.scrollHeight;
      parent.postMessage({ frameHeight: h }, "*");
    }
    window.addEventListener("load", inviaAltezza);
    window.addEventListener("resize", inviaAltezza);
  </script>
</body>
</html>
