<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo Beps</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background: #fafafa;
}

h2 {
  margin-top: 40px;
  border-bottom: 2px solid #ddd;
  padding-bottom: 5px;
}

.categoria { margin-bottom: 60px; }

.griglia {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.card {
  display: flex;
  gap: 20px;
  background: #fff;
  border: 1px solid #ddd;
  padding: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

.carousel {
  width: 360px;
  height: 360px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.img-slot {
  width: 340px;
  height: 340px;
  background: #f0f0f0;
}

.carousel-img {
  width: 340px;
  height: 340px;
  object-fit: contain;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(0,0,0,0.45);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
}

.arrow.left { left: 8px; }
.arrow.right { right: 8px; }

.carousel:hover .arrow { opacity: 1; }
.carousel[data-count="1"] .arrow { display:none; }

.dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  position: absolute;
  bottom: 8px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ccc;
}
.dot.active { background: #00a6c7; }

.card-content { flex: 1; }

.card-content h3 {
  margin: 0 0 8px;
  font-size: 1.2rem;
}

.card-content p {
  margin: 0 0 6px;
  font-size: 0.95rem;
}

.sku {
  font-size: 0.85rem;
  color: #666;
}

@media (max-width: 768px) {
  .card { flex-direction: column; }

  .carousel {
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
  }

  .img-slot,
  .carousel-img {
    max-width: 100%;
    max-height: 100%;
  }
}
</style>
</head>

<body>

<div id="catalogo"></div>

<script>
/* ================= CONFIG ================= */

const PROXY_URL = "https://proxy-catalog-826935378869.europe-west1.run.app";

// Immagini post-migrazione (galleria standard Magento)
const MAGENTO_MEDIA_BASE = "https://www.beps.it/media/catalog/product/";
// Immagini pre-migrazione (vecchio schema attributi image_main / image_additional)
const LEGACY_BASE = "https://www.beps.it/items/";
const MAX_IMAGES = 3;

/* ================= NORMALIZZAZIONE ================= */

function normalize(str) {
  return str
    ? str.toLowerCase().trim().replace(/[\s–—-]+/g, "-").replace(/^-+|-+$/g, "")
    : null;
}

function formatCategoriaLabel(v) {
  if (!v) return "";
  const s = v.replace(/-/g, " ").toLowerCase();
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ================= FIX LINK + IMG DESCRIZIONE ================= */

function fixDescriptionLinks(html) {
  if (!html) return "";

  const wrapper = document.createElement("div");
  wrapper.innerHTML = html;

  wrapper.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href").trim();

    if (
      !href.startsWith("http://") &&
      !href.startsWith("https://") &&
      !href.startsWith("mailto:") &&
      !href.startsWith("tel:")
    ) {
      a.setAttribute(
        "href",
        "https://www.beps.it/" + href.replace(/^\/+/, "")
      );
    }

    a.setAttribute("target", "_blank");
    a.setAttribute("rel", "noopener noreferrer");
  });

  wrapper.querySelectorAll("img[src]").forEach(img => {
    const src = img.getAttribute("src").trim();

    if (
      !src.startsWith("http://") &&
      !src.startsWith("https://") &&
      !src.startsWith("data:")
    ) {
      img.setAttribute(
        "src",
        "https://www.beps.it/" + src.replace(/^\/+/, "")
      );
    }

    img.setAttribute("loading", "lazy");
  });

  return wrapper.innerHTML;
}

/* ================= URL PARAMS ================= */

const params = new URLSearchParams(location.search);
const marcaFilter = normalize(params.get("marca"));
const categoriaFilter = normalize(params.get("categoria"));

const tipologiaFilter = params.get("tipologia")
  ? params.get("tipologia")
      .split(",")
      .map(t => normalize(t))
      .filter(Boolean)
  : null;

const categoriaLabel = formatCategoriaLabel(params.get("categoria"));

/* ================= INIT UI ================= */

const container = document.getElementById("catalogo");

const categoriaBlock = document.createElement("div");
categoriaBlock.className = "categoria";
categoriaBlock.innerHTML = `
  <h2>${categoriaLabel || "Prodotti"}</h2>
  <div class="griglia"></div>
`;
container.appendChild(categoriaBlock);

const grid = categoriaBlock.querySelector(".griglia");

/* ================= IMMAGINI ================= */

// Trasforma un valore Magento (URL assoluto, /g/u/file.jpg, g/u/file.jpg) in URL assoluto
function toMagentoUrl(v) {
  if (!v) return null;
  const s = String(v).trim();
  if (!s || /placeholder/i.test(s) || s === "no_selection") return null;
  if (/^https?:\/\//i.test(s)) return s;
  return MAGENTO_MEDIA_BASE + s.replace(/^\/+/, "").replace(/^media\/catalog\/product\//, "");
}

// Divide un elenco di immagini qualunque sia il separatore (virgola, pipe, punto e virgola, spazi)
function splitList(v) {
  return v ? String(v).split(/[,|;\s]+/).map(s => s.trim()).filter(Boolean) : [];
}

// Chiave per deduplicare: nome file senza estensione/suffisso dimensione
function imgKey(url) {
  return url.split("?")[0].split("/").pop().replace(/(_\d+x\d+)?\.\w+$/, "").toLowerCase();
}

function getMagentoImages(p) {
  const out = [];
  const main = toMagentoUrl(p.image_magento);
  if (main) out.push(main);
  splitList(p.gallery_magento).map(toMagentoUrl).filter(Boolean).forEach(u => out.push(u));
  return out;
}

function getLegacyImages(p) {
  const out = [];
  const path = (p.image_path || "").replace(/^\/+|\/+$/g, "");

  if (p.image_url) {
    if (/^https?:\/\//i.test(p.image_url)) {
      out.push(p.image_url);
    } else if (path) {
      out.push(`${LEGACY_BASE}${path}/jpg/${p.image_url}_900x900.jpg`);
    }
  }

  if (p.image_additional && path) {
    splitList(p.image_additional).forEach(n => {
      out.push(`${LEGACY_BASE}${path}/jpg/${n}_900x900.jpg`);
    });
  }

  return out;
}

// Priorità: galleria Magento (post-migrazione); se vuota, vecchio schema
function getProductImages(p) {
  const magento = getMagentoImages(p);
  const source = magento.length ? magento : getLegacyImages(p);

  const seen = new Set();
  const imgs = [];
  for (const u of source) {
    const k = imgKey(u);
    if (seen.has(k)) continue;
    seen.add(k);
    imgs.push(u);
    if (imgs.length >= MAX_IMAGES) break;
  }
  return { imgs, fallback: magento.length ? getLegacyImages(p) : [] };
}

/* ================= FETCH ================= */

fetch(PROXY_URL)
  .then(r => r.json())
  .then(prodotti => {

    const filtrati = prodotti.filter(p => {
      if (marcaFilter && normalize(p.marca) !== marcaFilter) return false;

      if (categoriaFilter) {
        const cats = p.category
          ? p.category.split(">").map(c => normalize(c))
          : [];
        if (!cats.includes(categoriaFilter)) return false;
      }

      if (
        tipologiaFilter &&
        !tipologiaFilter.includes(normalize(p.tipologia))
      ) return false;

      return true;
    });

    if (!filtrati.length) {
      grid.innerHTML = "<p>Nessun prodotto trovato.</p>";
      return;
    }

    filtrati.forEach(p => {
      const { imgs, fallback } = getProductImages(p);

      const dots = imgs.length > 1
        ? `<div class="dots">
            ${imgs.map((_,i)=>`<span class="dot ${i===0?"active":""}"></span>`).join("")}
           </div>`
        : "";

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="carousel" data-count="${imgs.length}">
          <div class="img-slot" data-images="${imgs.join("|")}" data-fallback="${fallback.join("|")}" data-index="0"></div>
          ${imgs.length > 1 ? `
            <div class="arrow left">&#10094;</div>
            <div class="arrow right">&#10095;</div>
          ` : ""}
          ${dots}
        </div>

        <div class="card-content">
          <h3>${p.title || ""}</h3>
          <p>${p.short_description || ""}</p>
          <p>${fixDescriptionLinks(p.description)}</p>
          <p class="sku"><strong>SKU:</strong> ${p.sku || ""}</p>
        </div>
      `;
      grid.appendChild(card);
    });

    initImages();
  });

/* ================= LAZY LOADING ================= */

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;

    const slot = e.target;
    observer.unobserve(slot);

    const images = slot.dataset.images ? slot.dataset.images.split("|") : [];
    const fallback = slot.dataset.fallback ? slot.dataset.fallback.split("|") : [];
    // Prova prima l'immagine principale, poi le alternative (incluso il vecchio schema)
    const candidates = [...images, ...fallback];
    if (!candidates.length) return;

    let attempt = 0;
    const img = new Image();
    img.className = "carousel-img";
    img.dataset.images = slot.dataset.images;
    img.dataset.index = "0";

    img.onload = () => {
      img.onload = null;
      img.onerror = null;
      if (slot.isConnected) slot.replaceWith(img);
    };
    img.onerror = () => {
      attempt++;
      if (attempt < candidates.length) img.src = candidates[attempt];
    };
    img.src = candidates[0];
  });
},{ rootMargin: "150px" });

function initImages() {
  document.querySelectorAll(".img-slot").forEach(s => observer.observe(s));
}

/* ================= CAROUSEL ================= */

function changeImage(img, dir) {
  const images = img.dataset.images.split("|");
  let i = parseInt(img.dataset.index, 10);

  i = dir === "next" ? i + 1 : i - 1;
  if (i < 0) i = images.length - 1;
  if (i >= images.length) i = 0;

  img.src = images[i];
  img.dataset.index = i;

  img.closest(".carousel")
    .querySelectorAll(".dot")
    .forEach((d, idx) => d.classList.toggle("active", idx === i));
}

document.addEventListener("click", e => {
  if (e.target.classList.contains("arrow")) {
    const img = e.target.closest(".carousel").querySelector(".carousel-img");
    if (img) {
      changeImage(
        img,
        e.target.classList.contains("right") ? "next" : "prev"
      );
    }
  }
});
</script>

</body>
</html>
