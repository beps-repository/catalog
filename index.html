<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo Beps</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background: #fafafa;
}

h2 {
  margin-top: 40px;
  border-bottom: 2px solid #ddd;
  padding-bottom: 5px;
}

.categoria { margin-bottom: 60px; }

.griglia {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.card {
  display: flex;
  gap: 20px;
  background: #fff;
  border: 1px solid #ddd;
  padding: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

.carousel {
  width: 360px;
  height: 360px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.img-slot {
  width: 340px;
  height: 340px;
  background: #f0f0f0;
}

.carousel-img {
  width: 340px;
  height: 340px;
  object-fit: contain;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(0,0,0,0.45);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
}

.arrow.left { left: 8px; }
.arrow.right { right: 8px; }

.carousel:hover .arrow { opacity: 1; }
.carousel[data-count="1"] .arrow { display:none; }

.dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  position: absolute;
  bottom: 8px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ccc;
}
.dot.active { background: #00a6c7; }

.card-content { flex: 1; }

.card-content h3 {
  margin: 0 0 8px;
  font-size: 1.2rem;
}

.card-content p {
  margin: 0 0 6px;
  font-size: 0.95rem;
}

.sku {
  font-size: 0.85rem;
  color: #666;
}

@media (max-width: 768px) {
  .card { flex-direction: column; }
  .carousel { width: 100%; }
}
</style>
</head>

<body>

<div id="catalogo"></div>

<script>
/* ================= CONFIG ================= */

const PROXY_URL = "https://proxy-catalog-826935378869.europe-west1.run.app";

/* ================= UTIL ================= */

function normalize(v) {
  return v ? v.toLowerCase().replace(/-/g," ").trim() : null;
}

function formatCategoriaLabel(v) {
  if (!v) return "";
  const s = v.replace(/-/g," ").toLowerCase();
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ================= FIX LINK DESCRIZIONE (ROBUSTO) ================= */

function fixDescriptionLinks(html) {
  if (!html) return "";

  const wrapper = document.createElement("div");
  wrapper.innerHTML = html;

  wrapper.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href").trim();

    // se NON è assoluto (http, https, mailto, tel)
    if (
      !href.startsWith("http://") &&
      !href.startsWith("https://") &&
      !href.startsWith("mailto:") &&
      !href.startsWith("tel:")
    ) {
      const clean = href.replace(/^\/+/, "");
      a.setAttribute("href", "https://www.beps.it/" + clean);
    }

    a.setAttribute("target", "_blank");
    a.setAttribute("rel", "noopener noreferrer");
  });

  return wrapper.innerHTML;
}

/* ================= URL PARAMS ================= */

const params = new URLSearchParams(location.search);
const marcaFilter = normalize(params.get("marca"));
const categoriaFilter = normalize(params.get("categoria"));
const categoriaLabel = formatCategoriaLabel(params.get("categoria"));

/* ================= INIT UI ================= */

const container = document.getElementById("catalogo");

const categoriaBlock = document.createElement("div");
categoriaBlock.className = "categoria";
categoriaBlock.innerHTML = `
  <h2>${categoriaLabel || "Prodotti"}</h2>
  <div class="griglia"></div>
`;
container.appendChild(categoriaBlock);

const grid = categoriaBlock.querySelector(".griglia");

/* ================= IMMAGINI ================= */

function getProductImages(p) {
  const imgs = [];

  if (p.image_url) imgs.push(p.image_url);

  if (p.image_additional && p.image_path) {
    const base = "https://www.beps.it/items/";
    const path = p.image_path.replace(/^\/+|\/+$/g,"") + "/";

    p.image_additional
      .split(",")
      .map(i => i.trim())
      .filter(Boolean)
      .slice(0,2)
      .forEach(n => {
        imgs.push(`${base}${path}jpg/${n}_300x300.jpg`);
      });
  }

  return imgs;
}

/* ================= FETCH ================= */

fetch(PROXY_URL)
  .then(r => r.json())
  .then(prodotti => {

    const filtrati = prodotti.filter(p => {
      if (marcaFilter && normalize(p.marca) !== marcaFilter) return false;

      if (categoriaFilter) {
        const cats = p.category?.toLowerCase().split(">").map(c=>c.trim()) || [];
        if (!cats.includes(categoriaFilter)) return false;
      }
      return true;
    });

    if (!filtrati.length) {
      grid.innerHTML = "<p>Nessun prodotto trovato.</p>";
      return;
    }

    filtrati.forEach(p => {
      const imgs = getProductImages(p);

      const dots = imgs.length > 1
        ? `<div class="dots">${imgs.map((_,i)=>`<span class="dot ${i===0?"active":""}"></span>`).join("")}</div>`
        : "";

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="carousel" data-count="${imgs.length}">
          <div class="img-slot" data-images="${imgs.join("|")}" data-index="0"></div>
          ${imgs.length>1?`
            <div class="arrow left">&#10094;</div>
            <div class="arrow right">&#10095;</div>`:""}
          ${dots}
        </div>
        <div class="card-content">
          <h3>${p.title || ""}</h3>
          <p>${p.short_description || ""}</p>
          <p>${fixDescriptionLinks(p.description)}</p>
          <p class="sku"><strong>SKU:</strong> ${p.sku || ""}</p>
        </div>
      `;
      grid.appendChild(card);
    });

    initImages();
  });

/* ================= LAZY IMAGE ================= */

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;

    const slot = e.target;
    const images = slot.dataset.images.split("|");

    const img = new Image();
    img.src = images[0];
    img.className = "carousel-img";
    img.dataset.images = slot.dataset.images;
    img.dataset.index = "0";

    img.onload = () => slot.replaceWith(img);
    observer.unobserve(slot);
  });
},{ rootMargin:"150px" });

function initImages() {
  document.querySelectorAll(".img-slot").forEach(s => observer.observe(s));
}

/* ================= CAROUSEL ================= */

function changeImage(img, dir) {
  const images = img.dataset.images.split("|");
  let i = parseInt(img.dataset.index,10);
  i = dir==="next" ? i+1 : i-1;
  if (i<0) i = images.length-1;
  if (i>=images.length) i = 0;
  img.src = images[i];
  img.dataset.index = i;

  img.closest(".carousel").querySelectorAll(".dot")
    .forEach((d,idx)=>d.classList.toggle("active", idx===i));
}

document.addEventListener("click", e => {
  if (e.target.classList.contains("arrow")) {
    const img = e.target.closest(".carousel").querySelector(".carousel-img");
    if (img) {
      changeImage(img, e.target.classList.contains("right")?"next":"prev");
    }
  }
});
</script>

</body>
</html>
