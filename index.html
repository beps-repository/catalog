<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo Beps</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background: #fafafa;
}

h2 {
  margin-top: 40px;
  border-bottom: 2px solid #ddd;
  padding-bottom: 5px;
  text-transform: capitalize;
}

.categoria { margin-bottom: 60px; }

.griglia {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.card {
  display: flex;
  gap: 20px;
  background: #fff;
  border: 1px solid #ddd;
  padding: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

/* ===== CAROUSEL ===== */

.carousel {
  width: 360px;
  position: relative;
  user-select: none;
  touch-action: pan-y;
}

.carousel[data-count="1"] .arrow {
  display: none !important;
}

.carousel-img {
  width: 100%;
  min-height: 220px;
  background: #f0f0f0;
  object-fit: contain;
  display: block;
}

.lazy-img {
  filter: blur(10px);
  transition: filter 0.3s ease;
}
.lazy-img[src] { filter: blur(0); }

/* ===== FRECCE ===== */

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(0,0,0,0.45);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.arrow.left { left: 8px; }
.arrow.right { right: 8px; }

.carousel:hover .arrow,
.carousel.show-arrows .arrow {
  opacity: 1;
}

/* ===== DOTS ===== */

.dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 8px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ccc;
}

.dot.active { background: #00a6c7; }

/* ===== TESTO ===== */

.card-content { flex: 1; }

.card-content h3 {
  margin: 0 0 8px;
  font-size: 1.2rem;
  color: #222;
}

.card-content p {
  margin: 0 0 6px;
  font-size: 0.95rem;
  color: #444;
}

.sku {
  font-size: 0.85rem;
  color: #666;
  margin-top: 8px;
}

/* ===== MOBILE ===== */

@media (max-width: 768px) {
  .card {
    flex-direction: column;
    text-align: center;
  }
  .carousel { width: 100%; }
}
</style>
</head>

<body>
<div id="catalogo">Caricamento catalogo…</div>

<script>
/* ================= CONFIG ================= */

const PROXY_URL = "https://proxy-catalog-826935378869.europe-west1.run.app";

/* ================= UTIL ================= */

function normalizeParam(v) {
  return v ? v.toLowerCase().replace(/-/g," ").trim() : null;
}

function getQueryParams() {
  const p = new URLSearchParams(location.search);
  return {
    marca: normalizeParam(p.get("marca")),
    categoria: normalizeParam(p.get("categoria"))
  };
}

function getProductImages(p) {
  const imgs = [];
  if (p.image_url) imgs.push(p.image_url);

  if (p.image_additional && p.image_path) {
    const base = "https://www.beps.it/items/";
    p.image_additional
      .split(",")
      .map(i => i.trim())
      .filter(Boolean)
      .slice(0, 2) // max 3 totali
      .forEach(n => imgs.push(`${base}${p.image_path}${n}_300x300.jpg`));
  }
  return imgs;
}

/* ================= CATALOGO ================= */

async function caricaCatalogo() {
  const container = document.getElementById("catalogo");

  try {
    const res = await fetch(PROXY_URL);
    const prodotti = await res.json();
    const { marca, categoria } = getQueryParams();

    const filtrati = prodotti.filter(p => {
      if (marca && p.marca?.toLowerCase().trim() !== marca) return false;
      if (categoria) {
        const cats = p.category?.toLowerCase().split(">").map(c=>c.trim()) || [];
        if (!cats.includes(categoria)) return false;
      }
      return true;
    });

    if (!filtrati.length) {
      container.innerHTML = "<p>Nessun prodotto trovato.</p>";
      inviaAltezza();
      return;
    }

    const gruppi = {};
    filtrati.forEach(p => {
      const c = p.category?.split(">").pop().trim() || "Senza categoria";
      (gruppi[c] ||= []).push(p);
    });

    container.innerHTML = "";
    const frag = document.createDocumentFragment();

    for (const [cat, items] of Object.entries(gruppi)) {
      const sec = document.createElement("div");
      sec.className = "categoria";
      sec.innerHTML = `<h2>${cat}</h2>`;
      const grid = document.createElement("div");
      grid.className = "griglia";

      items.forEach(p => {
        const imgs = getProductImages(p);
        const dots = imgs.length > 1
          ? `<div class="dots">${imgs.map((_,i)=>`<span class="dot ${i===0?"active":""}"></span>`).join("")}</div>`
          : "";

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="carousel" data-count="${imgs.length}">
            <img class="lazy-img carousel-img"
                 data-src="${imgs[0]}"
                 data-images="${imgs.join("|")}"
                 data-index="0"
                 alt="${p.title}">
            ${imgs.length > 1 ? `
              <div class="arrow left">&#10094;</div>
              <div class="arrow right">&#10095;</div>` : ""}
            ${dots}
          </div>
          <div class="card-content">
            <h3>${p.title}</h3>
            <p>${p.short_description || ""}</p>
            <p>${p.description || ""}</p>
            <p class="sku"><strong>SKU:</strong> ${p.sku}</p>
          </div>`;
        grid.appendChild(card);
      });

      sec.appendChild(grid);
      frag.appendChild(sec);
    }

    container.appendChild(frag);
    initLazyImages();
    inviaAltezza();

  } catch(e) {
    console.error(e);
    container.innerHTML = "<p>Errore caricamento catalogo</p>";
    inviaAltezza();
  }
}

/* ================= LAZY ================= */

function initLazyImages() {
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(x=>{
      if(!x.isIntersecting) return;
      x.target.src = x.target.dataset.src;
      obs.unobserve(x.target);
    });
  },{rootMargin:"200px"});
  document.querySelectorAll("img.lazy-img").forEach(i=>obs.observe(i));
}

/* ================= CAROUSEL ================= */

function changeImage(img, dir) {
  const carousel = img.closest(".carousel");
  if (carousel.dataset.count === "1") return;

  const images = img.dataset.images.split("|");
  let i = parseInt(img.dataset.index,10);
  i = dir === "next" ? i+1 : i-1;
  if (i<0) i = images.length-1;
  if (i>=images.length) i = 0;
  img.src = images[i];
  img.dataset.index = i;

  const dots = carousel.querySelectorAll(".dot");
  dots.forEach((d,idx)=>d.classList.toggle("active", idx===i));
}

document.addEventListener("click", e => {
  if (e.target.classList.contains("arrow")) {
    const img = e.target.closest(".carousel").querySelector(".carousel-img");
    changeImage(img, e.target.classList.contains("right") ? "next" : "prev");
  }
});

let startX=null;
document.addEventListener("touchstart", e=>{
  const carousel = e.target.closest(".carousel");
  if (!carousel || carousel.dataset.count === "1") return;
  startX = e.touches[0].clientX;
});
document.addEventListener("touchend", e=>{
  if(startX===null) return;
  const carousel = e.target.closest(".carousel");
  if (!carousel || carousel.dataset.count === "1") return;
  const img = carousel.querySelector(".carousel-img");
  const diff = e.changedTouches[0].clientX - startX;
  startX=null;
  if(Math.abs(diff)<40) return;
  changeImage(img, diff<0?"next":"prev");
});

/* ================= IFRAME ================= */

let resizeTimeout;
function inviaAltezza() {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(()=>{
    parent.postMessage({frameHeight:document.body.scrollHeight},"*");
  },100);
}
window.addEventListener("resize", inviaAltezza);

/* ================= START ================= */

caricaCatalogo();
</script>
</body>
</html>
