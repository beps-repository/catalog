<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogo Beps</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #fafafa;
    }

    h2 {
      margin-top: 40px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 5px;
      text-transform: capitalize;
    }

    .categoria {
      margin-bottom: 60px;
    }

    .griglia {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      display: flex;
      gap: 20px;
      background: #fff;
      border: 1px solid #ddd;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    /* ===== CAROUSEL ===== */

    .carousel {
      width: 360px;
      user-select: none;
      touch-action: pan-y;
    }

    .carousel-img {
      width: 100%;
      min-height: 200px;
      background: #f0f0f0;
      object-fit: contain;
      display: block;
    }

    .lazy-img {
      filter: blur(10px);
      transition: filter 0.3s ease;
    }

    .lazy-img[src] {
      filter: blur(0);
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      cursor: pointer;
    }

    .dot.active {
      background: #00a6c7;
    }

    /* ===== TESTO ===== */

    .card-content {
      flex: 1;
    }

    .card-content h3 {
      margin: 0 0 8px;
      font-size: 1.2rem;
      color: #222;
    }

    .card-content p {
      margin: 0 0 6px;
      font-size: 0.95rem;
      color: #444;
    }

    .sku {
      font-size: 0.85rem;
      color: #666;
      margin-top: 8px;
    }

    @media (max-width: 768px) {
      .card {
        flex-direction: column;
        text-align: center;
      }

      .carousel {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="catalogo">Caricamento catalogo…</div>

  <script>
    /* ================= CONFIG ================= */

    const PROXY_URL = "https://proxy-catalog-826935378869.europe-west1.run.app";

    /* ================= UTIL ================= */

    function normalizeParam(value) {
      return value
        ? value.toLowerCase().replace(/-/g, " ").trim()
        : null;
    }

    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        marca: normalizeParam(params.get("marca")),
        categoria: normalizeParam(params.get("categoria"))
      };
    }

    function getProductImages(p) {
      const images = [];

      if (p.image_url) images.push(p.image_url);

      if (p.image_additional && p.image_path) {
        const baseUrl = "https://www.beps.it/items/";
        p.image_additional
          .split(",")
          .map(i => i.trim())
          .filter(Boolean)
          .slice(0, 2) // max 3 totali
          .forEach(name => {
            images.push(
              `${baseUrl}${p.image_path}${name}_300x300.jpg`
            );
          });
      }

      return images;
    }

    /* ================= CATALOGO ================= */

    async function caricaCatalogo() {
      const container = document.getElementById("catalogo");

      try {
        const response = await fetch(PROXY_URL);
        const prodotti = await response.json();
        const { marca, categoria } = getQueryParams();

        const filtrati = [];
        for (const p of prodotti) {
          const marcaProdotto = p.marca?.toLowerCase().trim() || "";
          if (marca && marcaProdotto !== marca) continue;

          const categorieProdotto = p.category
            ? p.category.toLowerCase().split(">").map(c => c.trim())
            : [];

          if (categoria && !categorieProdotto.includes(categoria)) continue;

          filtrati.push(p);
        }

        if (!filtrati.length) {
          container.innerHTML = "<p>Nessun prodotto trovato.</p>";
          inviaAltezza();
          return;
        }

        const gruppi = {};
        for (const p of filtrati) {
          const cat = p.category?.split(">").pop().trim() || "Senza categoria";
          if (!gruppi[cat]) gruppi[cat] = [];
          gruppi[cat].push(p);
        }

        container.innerHTML = "";
        const fragment = document.createDocumentFragment();

        for (const [cat, items] of Object.entries(gruppi)) {
          const sezione = document.createElement("div");
          sezione.className = "categoria";

          const titolo = document.createElement("h2");
          titolo.textContent = cat;
          sezione.appendChild(titolo);

          const griglia = document.createElement("div");
          griglia.className = "griglia";

          for (const p of items) {
            const images = getProductImages(p);

            const dotsHTML = images.length > 1
              ? `<div class="dots">
                  ${images.map((_, i) =>
                    `<span class="dot ${i === 0 ? "active" : ""}"></span>`
                  ).join("")}
                </div>`
              : "";

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
              <div class="carousel" data-images='${JSON.stringify(images)}' data-index="0">
                <img
                  class="lazy-img carousel-img"
                  data-src="${images[0]}"
                  alt="${p.title}"
                >
                ${dotsHTML}
              </div>

              <div class="card-content">
                <h3>${p.title}</h3>
                <p>${p.short_description || ""}</p>
                <p>${p.description || ""}</p>
                <p class="sku"><strong>SKU:</strong> ${p.sku}</p>
              </div>
            `;

            griglia.appendChild(card);
          }

          sezione.appendChild(griglia);
          fragment.appendChild(sezione);
        }

        container.appendChild(fragment);

        initLazyImages();
        initDotNavigation();
        initSwipeNavigation();
        inviaAltezza();

      } catch (err) {
        console.error(err);
        container.innerHTML = "<p>Errore nel caricamento del catalogo.</p>";
        inviaAltezza();
      }
    }

    /* ================= LAZY IMAGES ================= */

    function initLazyImages() {
      const images = document.querySelectorAll("img.lazy-img");

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const img = entry.target;
          img.src = img.dataset.src;
          observer.unobserve(img);
        });
      }, { rootMargin: "200px 0px" });

      images.forEach(img => observer.observe(img));
    }

    /* ================= CAROUSEL ================= */

    function updateCarousel(carousel, index) {
      const images = JSON.parse(carousel.dataset.images);
      const img = carousel.querySelector(".carousel-img");
      const dots = carousel.querySelectorAll(".dot");

      if (index < 0) index = images.length - 1;
      if (index >= images.length) index = 0;

      img.src = images[index];
      carousel.dataset.index = index;

      dots.forEach((d, i) =>
        d.classList.toggle("active", i === index)
      );
    }

    function initDotNavigation() {
      document.querySelectorAll(".carousel").forEach(carousel => {
        const dots = carousel.querySelectorAll(".dot");
        dots.forEach((dot, index) => {
          dot.addEventListener("click", () =>
            updateCarousel(carousel, index)
          );
        });
      });
    }

    function initSwipeNavigation() {
      document.querySelectorAll(".carousel").forEach(carousel => {
        let startX = 0;
        let dragging = false;

        const start = x => {
          startX = x;
          dragging = true;
        };

        const end = x => {
          if (!dragging) return;
          const diff = x - startX;
          dragging = false;

          if (Math.abs(diff) < 40) return;

          const index = parseInt(carousel.dataset.index, 10);
          updateCarousel(carousel, diff < 0 ? index + 1 : index - 1);
        };

        carousel.addEventListener("touchstart", e =>
          start(e.touches[0].clientX)
        );
        carousel.addEventListener("touchend", e =>
          end(e.changedTouches[0].clientX)
        );

        carousel.addEventListener("mousedown", e =>
          start(e.clientX)
        );
        carousel.addEventListener("mouseup", e =>
          end(e.clientX)
        );
        carousel.addEventListener("mouseleave", () =>
          dragging = false
        );
      });
    }

    /* ================= IFRAME ================= */

    let resizeTimeout;
    function inviaAltezza() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        parent.postMessage(
          { frameHeight: document.body.scrollHeight },
          "*"
        );
      }, 100);
    }

    window.addEventListener("resize", inviaAltezza);

    /* ================= START ================= */

    caricaCatalogo();
  </script>
</body>
</html>
